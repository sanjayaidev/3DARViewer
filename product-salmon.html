<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charred Miso Salmon — AR Menu</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<!-- model-viewer handles View 3D + Simple AR natively -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<!-- Three.js, for Advanced AR mode -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/webxr-ar.js"></script>
</head>
<body>

<header class="site-header">
  <a href="products.html" class="back-link" aria-label="Back to menu">&larr;</a>
  <span class="site-mark">The Ember Room</span>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="product-stage">

  <!-- Viewer -->
  <section class="viewer-wrap" aria-label="Dish viewer">

    <model-viewer
      id="viewer"
      class="viewer"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
      alt="3D model of Charred Miso Salmon"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      auto-rotate-delay="1200"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="none"
      autoplay
    >
      <div class="poster-note" slot="poster">Loading dish&hellip;</div>
    </model-viewer>

    <!-- Advanced AR takes over this canvas when active; hidden otherwise -->
    <canvas id="xr-canvas" class="xr-canvas" hidden></canvas>

    <div id="advancedArNotice" class="ar-notice" hidden>
      <p id="advancedArNoticeText"></p>
      <button type="button" id="advancedArNoticeClose" class="notice-close">Dismiss</button>
    </div>

    <!-- Rendered on top of the camera feed only during an active Advanced AR session -->
    <div id="arOverlay" class="ar-overlay" hidden>
      <p class="ar-overlay-hint" id="arHint"></p>
      <div class="ar-overlay-controls">
        <button type="button" id="arExitBtn" class="ar-exit-btn">Exit AR</button>
        <button type="button" id="arAddToCartBtn" class="ar-cart-btn" hidden>Add to cart</button>
      </div>
    </div>

  </section>

  <!-- Mode switch -->
  <div class="mode-switch" role="tablist" aria-label="Viewing mode">
    <button type="button" class="mode-tab is-active" id="modeView3D" role="tab" aria-selected="true">
      <span class="mode-index">01</span> View 3D
    </button>
    <button type="button" class="mode-tab" id="modeSimpleAR" role="tab" aria-selected="false">
      <span class="mode-index">02</span> Simple AR
    </button>
    <button type="button" class="mode-tab" id="modeAdvancedAR" role="tab" aria-selected="false">
      <span class="mode-index">03</span> Advanced AR
    </button>
  </div>

  <!-- Product info -->
  <section class="product-info">
    <p class="product-category">Mains · Robata Grill</p>
    <h1 class="product-name">Charred Miso Salmon</h1>
    <p class="product-desc">Cedar-smoked, saikyo miso glaze, charred scallion, sesame.</p>
    <div class="product-footer">
      <span class="product-price">$28</span>
      <button type="button" class="add-to-cart" id="addToCart">Add to cart</button>
    </div>
  </section>

</main>

<script>
  const viewer = document.getElementById('viewer');
  const xrCanvas = document.getElementById('xr-canvas');
  const PLACEHOLDER_GLB = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';
  const PLACEHOLDER_USDZ = 'https://modelviewer.dev/shared-assets/models/Astronaut.usdz';

  const notice = document.getElementById('advancedArNotice');
  const noticeText = document.getElementById('advancedArNoticeText');
  const noticeClose = document.getElementById('advancedArNoticeClose');

  const tabs = {
    view3d: document.getElementById('modeView3D'),
    simpleAr: document.getElementById('modeSimpleAR'),
    advancedAr: document.getElementById('modeAdvancedAR'),
  };

  function setActiveTab(activeKey) {
    Object.entries(tabs).forEach(([key, el]) => {
      const isActive = key === activeKey;
      el.classList.toggle('is-active', isActive);
      el.setAttribute('aria-selected', String(isActive));
    });
  }

  tabs.view3d.addEventListener('click', () => {
    setActiveTab('view3d');
    notice.hidden = true;
    xrCanvas.hidden = true;
    viewer.hidden = false;
    viewer.cameraOrbit = '0deg 75deg 105%';
  });

  tabs.simpleAr.addEventListener('click', () => {
    setActiveTab('simpleAr');
    notice.hidden = true;
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      noticeText.textContent = 'Simple AR isn\u2019t available on this browser/device. Try opening this page on a phone with Chrome (Android) or Safari (iPhone).';
      notice.hidden = false;
    }
  });

  tabs.advancedAr.addEventListener('click', async () => {
    setActiveTab('advancedAr');
    notice.hidden = true;

    if (!window.AdvancedAR) {
      noticeText.textContent = 'Advanced AR is still loading \u2014 give it a second and tap again.';
      notice.hidden = false;
      return;
    }

    const supported = await window.AdvancedAR.isSupported();
    if (!supported) {
      noticeText.textContent = 'Advanced AR needs Chrome on an AR-capable Android device. Try Simple AR instead.';
      notice.hidden = false;
      setActiveTab('view3d');
      return;
    }

    viewer.hidden = true;
    xrCanvas.hidden = false;

    window.AdvancedAR.start({
      modelUrl: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
      onExit: () => {
        xrCanvas.hidden = true;
        viewer.hidden = false;
        setActiveTab('view3d');
      },
      onAddToCart: () => {
        console.log('Added to cart from Advanced AR (cart wiring comes later).');
      },
    });
  });

  noticeClose.addEventListener('click', () => {
    notice.hidden = true;
  });

  document.getElementById('addToCart').addEventListener('click', () => {
    alert('Cart wiring comes later \u2014 this button is just a stub for now.');
  });
</script>

</body>
</html>
